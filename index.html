<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="头疗日记">
<meta name="theme-color" content="#f5f6f8">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>头疗日记</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --ink:#111827; --sub:#8b93a1; --line:#eef0f4;
    --accent:#2f6bff; --green:#0f9d58; --red:#e5484d; --amber:#c26a00;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
    -webkit-font-smoothing:antialiased;overscroll-behavior:none}
  body{padding-bottom:calc(210px + env(safe-area-inset-bottom))}
  .safe{height:calc(12px + env(safe-area-inset-top))}

  header{display:flex;align-items:center;justify-content:space-between;padding:4px 18px 10px}
  .navbtn{width:36px;height:36px;border-radius:18px;background:#fff;border:none;color:#4b5563;
    font-size:17px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(17,24,39,.05)}
  .navbtn:active{background:#eef0f4}
  .datemid{text-align:center;flex:1}
  .datemid b{font-size:17px;letter-spacing:.2px}
  .datemid span{display:block;font-size:11px;color:var(--sub);margin-top:3px}

  .cards{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:9px;padding:0 16px}
  .card{background:var(--card);border-radius:16px;padding:13px 10px 12px;text-align:center;box-shadow:0 1px 3px rgba(17,24,39,.05)}
  .card .n{font-size:21px;font-weight:700;letter-spacing:-.6px;line-height:1.1}
  .card .n small{font-size:11px;font-weight:500;color:var(--sub);margin-left:2px;letter-spacing:0}
  .card .l{font-size:11px;color:var(--sub);margin-top:5px}
  .card.hero{background:linear-gradient(158deg,#2f6bff,#5f8dff);box-shadow:0 8px 18px rgba(47,107,255,.25)}
  .card.hero .n,.card.hero .l{color:#fff}
  .card.hero .n small{color:rgba(255,255,255,.82)}

  .weekline{display:flex;justify-content:center;gap:8px;font-size:12px;color:var(--sub);padding:12px 16px 4px;flex-wrap:wrap}
  .weekline b{color:var(--ink);font-weight:600}

  .sec{padding:10px 16px 0}
  .sec h2{font-size:12px;color:var(--sub);font-weight:600;margin:8px 4px 8px;letter-spacing:.4px}
  .list{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 1px 3px rgba(17,24,39,.05)}
  .row{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .row:active{background:#fafbfd}
  .row .main{flex:1;min-width:0}
  .row .main .t{font-size:15px;font-weight:600}
  .row .main .s{font-size:11px;color:var(--sub);margin-top:3px}
  .row .main .s em{font-style:normal;color:var(--green)}
  .row .amt{text-align:right}
  .row .amt b{font-size:16px;letter-spacing:-.3px}
  .row .amt b.dash{color:#c2c7d0}
  .row .amt span{display:block;font-size:11px;color:var(--green);margin-top:3px}
  .row .tm{font-size:11px;color:var(--sub);width:38px}
  .empty{text-align:center;color:var(--sub);font-size:13px;padding:36px 0 32px;line-height:1.7}
  .empty .big{font-size:28px;margin-bottom:6px;opacity:.55}
  .sum-btn{display:flex;align-items:center;justify-content:space-between;width:100%;margin:12px 0 0;
    background:#fff;border:none;border-radius:16px;padding:16px;font-family:inherit;
    box-shadow:0 1px 3px rgba(17,24,39,.05)}
  .sum-btn .l{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600;color:var(--ink)}
  .sum-btn .r{font-size:12px;color:var(--sub)}
  .setlink{display:block;width:100%;margin:12px 0 0;padding:10px;border:none;background:none;color:#9aa1ad;font-size:12px;font-family:inherit}

  .composer{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);
    backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
    border-top:1px solid var(--line);padding:10px 14px calc(12px + env(safe-area-inset-bottom))}
  .pjbar{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
  .pjbar::-webkit-scrollbar{display:none}
  .pj{flex:0 0 auto;border:1.5px solid transparent;background:#f1f3f7;color:#374151;border-radius:12px;
    padding:9px 14px;font-size:13px;font-weight:600;font-family:inherit;transition:transform .08s}
  .pj:active{transform:scale(.96)}
  .pj.on{background:#111827;color:#fff}
  .pj .w{font-size:10px;opacity:.55;margin-left:4px;font-weight:500}

  .seline{font-size:12px;color:var(--sub);padding:2px 2px 8px;min-height:18px}
  .seline b{color:var(--ink)}
  .seline em{font-style:normal;color:var(--green);font-weight:600}

  .inputrow{display:flex;gap:9px;align-items:center}
  .amount{flex:1;height:50px;border-radius:14px;background:#f1f3f7;display:flex;align-items:center;padding:0 14px}
  .amount .cur{font-size:16px;color:var(--sub);margin-right:6px}
  .amount input{border:none;background:none;outline:none;font-size:19px;font-weight:700;width:100%;
    font-family:inherit;color:var(--ink);letter-spacing:-.5px}
  .amount input::placeholder{color:#c2c7d0;font-weight:500;font-size:15px;letter-spacing:0}
  .send{height:50px;border-radius:14px;background:var(--accent);color:#fff;border:none;
    padding:0 18px;font-size:15px;font-weight:600;font-family:inherit;box-shadow:0 6px 14px rgba(47,107,255,.28)}
  .send:disabled{background:#d6dae2;box-shadow:none}
  .send:active{transform:scale(.97)}

  .toast{position:fixed;left:50%;bottom:calc(210px + env(safe-area-inset-bottom));transform:translate(-50%,10px);
    background:rgba(17,24,39,.94);color:#fff;font-size:13px;padding:10px 16px;border-radius:12px;opacity:0;
    transition:.22s;pointer-events:none;z-index:60;display:flex;align-items:center;gap:12px;white-space:nowrap}
  .toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .toast u{color:#8ab4ff;text-decoration:none;font-weight:600}

  .sheet-mask{position:fixed;inset:0;background:rgba(17,24,39,.35);opacity:0;pointer-events:none;transition:.2s;z-index:40}
  .sheet-mask.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));background:#fff;
    border-radius:20px;padding:8px;transform:translateY(120%);transition:.25s cubic-bezier(.32,.72,0,1);z-index:41;max-height:82vh;overflow:auto}
  .sheet.on{transform:translateY(0)}
  .sheet button{display:block;width:100%;border:none;background:none;font-family:inherit;font-size:16px;
    padding:16px;border-radius:14px;color:var(--ink);border-bottom:1px solid #f2f4f8}
  .sheet button:last-child{border-bottom:none}
  .sheet button:active{background:#f5f6f8}
  .sheet button.danger{color:var(--red)}
  .sheet button.cancel{color:var(--sub);font-size:15px}
  .sheet .head{padding:12px 16px 6px;font-size:12px;color:var(--sub);text-align:left}
  .sheet .line{display:flex;justify-content:space-between;padding:8px 16px;font-size:14px}
  .sheet .line span:last-child{color:var(--green);font-weight:600}
  .sheet .total{display:flex;justify-content:space-between;padding:10px 16px 14px;font-size:13px;color:var(--sub);border-top:1px solid #f2f4f8;margin-top:4px}
  .sheet .total b{color:var(--ink)}

  .report{position:fixed;inset:0;background:var(--bg);z-index:70;transform:translateY(100%);
    transition:transform .28s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top)}
  .report.on{transform:translateY(0)}
  .report-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 6px}
  .report-head .x{width:36px;height:36px;border:none;background:#fff;border-radius:18px;font-size:15px;color:#4b5563;box-shadow:0 1px 3px rgba(17,24,39,.05)}
  .seg{display:flex;background:#eceef4;border-radius:10px;padding:3px}
  .seg button{border:none;background:none;font-family:inherit;font-size:14px;font-weight:600;
    color:#6b7280;padding:6px 20px;border-radius:8px}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .period{display:flex;align-items:center;justify-content:center;gap:14px;padding:8px 16px 4px}
  .period button{border:none;background:none;font-size:18px;color:#6b7280;padding:4px 8px}
  .period span{font-size:13px;color:var(--sub);min-width:170px;text-align:center}
  .report-body{flex:1;overflow:auto;padding:6px 16px calc(30px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:8px 0 4px}
  .kpi{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 3px rgba(17,24,39,.05)}
  .kpi .v{font-size:22px;font-weight:700;letter-spacing:-.6px}
  .kpi .v small{font-size:11px;font-weight:500;color:var(--sub);margin-left:2px}
  .kpi .k{font-size:11px;color:var(--sub);margin-top:4px}
  .kpi.hero{background:linear-gradient(158deg,#2f6bff,#5f8dff);box-shadow:0 8px 18px rgba(47,107,255,.22)}
  .kpi.hero .v,.kpi.hero .k{color:#fff}
  .kpi.hero .v small{color:rgba(255,255,255,.8)}
  .blk{background:#fff;border-radius:16px;margin-top:10px;overflow:hidden;box-shadow:0 1px 3px rgba(17,24,39,.05)}
  .blk h3{font-size:12px;color:var(--sub);font-weight:600;margin:0;padding:14px 15px 8px}
  .trow{display:flex;align-items:center;gap:10px;padding:11px 15px;border-top:1px solid var(--line);font-size:14px}
  .trow:first-of-type{border-top:none}
  .trow .nm{flex:1;font-weight:600}
  .trow .c{width:64px;text-align:right;color:var(--sub);font-size:12px}
  .trow .m{min-width:74px;text-align:right;font-size:13px;line-height:1.35}
  .trow .m i{display:block;font-style:normal;color:var(--green);font-size:11px;margin-top:2px}
  .day{display:flex;align-items:center;gap:10px;padding:11px 15px;border-top:1px solid var(--line);font-size:13px}
  .day:first-of-type{border-top:none}
  .day .d{width:74px;color:var(--sub)}
  .day .n{flex:1;color:var(--ink)}
  .day .v{text-align:right;font-weight:600}
  .day .v span{display:block;font-size:11px;color:var(--green);font-weight:400;margin-top:2px}
  .cmp{font-size:12px;color:var(--sub);padding:8px 2px 0}
  .cmp b{color:var(--ink)}

  .prow{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
  .prow:first-of-type{border-top:none}
  .prow input{width:0;border:none;background:#f1f3f7;border-radius:9px;padding:9px 10px;font-family:inherit;font-size:14px;outline:none}
  .prow input.nm{flex:1 1 auto;width:auto;min-width:90px}
  .prow input.num{flex:0 0 58px;width:58px;text-align:center;padding:9px 4px}
  .prow .del{border:none;background:none;color:var(--red);font-size:18px;padding:6px 8px}
  .addpj{display:block;width:100%;border:none;background:none;color:var(--accent);font-family:inherit;font-size:14px;font-weight:600;padding:14px}
</style>
</head>
<body>
  <div class="safe"></div>

  <header>
    <button class="navbtn" id="prev">‹</button>
    <div class="datemid"><b id="dateLabel">11月1日</b><span id="dateSub">今天</span></div>
    <button class="navbtn" id="next">›</button>
  </header>

  <div class="cards">
    <div class="card hero"><div class="n" id="sRev">0<small>元</small></div><div class="l">业绩</div></div>
    <div class="card"><div class="n" id="sCnt">0<small>个</small></div><div class="l">人头</div></div>
    <div class="card"><div class="n" id="sComm">0<small>元</small></div><div class="l">提成</div></div>
  </div>

  <div class="weekline" id="weekline"></div>

  <div class="sec">
    <h2 id="listTitle">今天的记录</h2>
    <div class="list" id="list"></div>
    <button class="sum-btn" id="summary">
      <span class="l">📊 周 / 月总结</span>
      <span class="r">业绩 · 人头 · 提成 ›</span>
    </button>
    <button class="setlink" id="settings">⚙︎ 设置与备份</button>
  </div>

  <div class="composer">
    <div class="pjbar" id="pjbar"></div>
    <div class="seline" id="seline"></div>
    <div class="inputrow">
      <div class="amount"><span class="cur">¥</span><input id="amount" type="number" inputmode="decimal" placeholder="业绩金额（可不填）"></div>
      <button class="send" id="send" disabled>记一笔</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="sheet-mask" id="mask"></div>
  <div class="sheet" id="sheet"></div>

  <div class="report" id="report">
    <div class="report-head">
      <button class="x" id="rClose">✕</button>
      <div class="seg" id="seg">
        <button data-m="week" class="on">周</button>
        <button data-m="month">月</button>
      </div>
      <div style="width:36px"></div>
    </div>
    <div class="period">
      <button id="rPrev">‹</button>
      <span id="rLabel"></span>
      <button id="rNext">›</button>
    </div>
    <div class="report-body" id="rBody"></div>
  </div>

<script>
(function(){
  'use strict';
  var KEY = 'toudiao.v2';

  var DEFAULTS = [
    { id:'p1', name:'头疗', comm:10, weight:1 },
    { id:'p2', name:'肩颈', comm:10, weight:1 },
    { id:'p3', name:'面部', comm:10, weight:1 },
    { id:'p4', name:'小项1元', comm:1, weight:0 },
    { id:'p5', name:'小项3元', comm:3, weight:0.5 },
    { id:'p6', name:'小项5元', comm:5, weight:0.5 }
  ];

  var state = load();
  if(state.__migrated){ delete state.__migrated; save(); }
  var cur = todayStr();
  var sel = {};          // 选中的项目 id
  var lastUndo = null;

  function todayStr(){ return ymd(new Date()); }
  function ymd(d){
    var m = d.getMonth()+1, day = d.getDate();
    return d.getFullYear()+'-'+(m<10?'0'+m:m)+'-'+(day<10?'0'+day:day);
  }
  function parseDate(s){ var p = s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  function round2(n){ return Math.round(n*100)/100; }
  function fmt(n){
    if(n===null||n===undefined||isNaN(n)) n = 0;
    var s = (Math.round(n*100)/100).toString(), p = s.split('.');
    p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return p.join('.');
  }
  function headStr(n){ return (Math.round(n*10)/10).toString(); }
  function clock(){ var d = new Date(); return (d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes(); }

  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){
        var o = JSON.parse(raw);
        if(o && o.days && o.projects) return migrate(o);
      }
    }catch(e){}
    return { projects: DEFAULTS.slice(), settings:{ cardRate:0.10 }, days:{} };
  }

  // 老版本只有一个“小项（3元 / 0.5）”，拆成 1 元 / 3 元 / 5 元三档
  function migrate(o){
    var ps = o.projects || [];
    for(var i=0;i<ps.length;i++){
      if(ps[i].name === '小项' && Math.abs(ps[i].comm - 3) < 1e-9 && Math.abs(ps[i].weight - 0.5) < 1e-9){
        var base = ps[i].id || 'p4';
        ps.splice(i, 1,
          { id: base+'a', name:'小项1元', comm:1, weight:0 },
          { id: base+'b', name:'小项3元', comm:3, weight:0.5 },
          { id: base+'c', name:'小项5元', comm:5, weight:0.5 }
        );
        o.projects = ps;
        o.__migrated = true;
        break;
      }
    }
    return o;
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){ toast('保存失败，存储可能满了'); } }

  function dayList(d){ return state.days[d] || []; }
  function projectOf(id){ for(var i=0;i<state.projects.length;i++) if(state.projects[i].id===id) return state.projects[i]; return null; }
  function typeName(p){ return p ? p.name : '—'; }

  function recordHead(r){ return r.head || 0; }
  function recordComm(r){ return r.comm || 0; }
  function recordRev(r){ return r.rev || 0; }

  // ---------- 渲染 ----------
  function render(){
    var list = dayList(cur), rev=0, comm=0, head=0;
    for(var i=0;i<list.length;i++){ rev += recordRev(list[i]); comm += recordComm(list[i]); head += recordHead(list[i]); }

    document.getElementById('sRev').innerHTML = fmt(rev)+'<small>元</small>';
    document.getElementById('sCnt').innerHTML = headStr(head)+'<small>个</small>';
    document.getElementById('sComm').innerHTML = fmt(comm)+'<small>元</small>';

    var d = parseDate(cur);
    var wk = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
    document.getElementById('dateLabel').textContent = (d.getMonth()+1)+'月'+d.getDate()+'日';
    document.getElementById('dateSub').textContent = wk + (cur===todayStr() ? ' · 今天' : '');

    var monday = new Date(d); monday.setDate(d.getDate()-((d.getDay()+6)%7));
    var wRev=0, wHead=0, wComm=0;
    for(var k=0;k<7;k++){
      var dd = new Date(monday); dd.setDate(monday.getDate()+k);
      var arr = dayList(ymd(dd));
      for(var j=0;j<arr.length;j++){ wRev+=recordRev(arr[j]); wComm+=recordComm(arr[j]); wHead+=recordHead(arr[j]); }
    }
    document.getElementById('weekline').innerHTML =
      '本周 <b>¥'+fmt(wRev)+'</b> · <b>'+headStr(wHead)+'</b> 个 · 提成 <b>¥'+fmt(wComm)+'</b>';

    var box = document.getElementById('list');
    if(!list.length){
      box.innerHTML = '<div class="empty"><div class="big">🫧</div>今天还没有记录<br><span style="font-size:12px">下面点项目，可选业绩金额，点「记一笔」</span></div>';
    }else{
      var html = '';
      for(var m=list.length-1;m>=0;m--){
        var r = list[m];
        var names = (r.items||[]).map(function(x){ return x.name; }).join(' + ') || '业绩充值';
        var sub = [];
        if(recordHead(r) > 0) sub.push('人头 '+headStr(recordHead(r)));
        if(recordRev(r) > 0) sub.push('业绩 ¥'+fmt(recordRev(r)));
        if(!sub.length) sub.push((r.items||[]).length ? '—' : '充值入账');
        html += '<div class="row" data-id="'+r.id+'">'+
          '<div class="tm">'+r.at+'</div>'+
          '<div class="main"><div class="t">'+names+'</div><div class="s">'+sub.join(' · ')+'</div></div>'+
          '<div class="amt"><b>¥'+fmt(recordComm(r))+'</b><span>提成</span></div>'+
        '</div>';
      }
      box.innerHTML = html;
    }
    document.getElementById('listTitle').textContent = (cur===todayStr()?'今天':'这天')+'的记录';

    renderBars();
  }

  function renderBars(){
    var bar = document.getElementById('pjbar');
    var html = '';
    for(var i=0;i<state.projects.length;i++){
      var p = state.projects[i];
      var sup = p.name.indexOf('元') >= 0 ? '' : '<span class="w">'+p.comm+'元</span>';
      html += '<button class="pj '+(sel[p.id]?'on':'')+'" data-id="'+p.id+'">'+p.name+sup+'</button>';
    }
    bar.innerHTML = html;
    renderSel();
  }

  function renderSel(){
    var ids = Object.keys(sel).filter(function(k){ return sel[k]; });
    var items = ids.map(projectOf).filter(Boolean);
    var comm = 0, head = 0;
    items.forEach(function(p){ comm += p.comm; head += p.weight; });

    var amt = parseFloat(document.getElementById('amount').value) || 0;
    var revComm = round2(amt * (state.settings.cardRate || 0.1));
    var total = round2(comm + revComm);

    var line = document.getElementById('seline');
    if(!items.length && !amt){
      line.innerHTML = '点头疗 / 肩颈… 可多选，选完点「记一笔」';
    }else{
      var parts = [];
      if(items.length) parts.push('<b>'+items.map(function(p){ return p.name; }).join(' + ')+'</b>');
      if(amt) parts.push('业绩 <b>¥'+fmt(amt)+'</b>');
      parts.push('提成 <em>¥'+fmt(total)+'</em>');
      parts.push('人头 <b>'+headStr(head)+'</b>');
      line.innerHTML = parts.join(' · ');
    }
    document.getElementById('send').disabled = !(items.length || amt > 0);
  }

  // ---------- 记录 ----------
  function confirmRecord(){
    var ids = Object.keys(sel).filter(function(k){ return sel[k]; });
    var items = ids.map(projectOf).filter(Boolean).map(function(p){
      return { id:p.id, name:p.name, comm:p.comm, weight:p.weight };
    });
    var amt = round2(parseFloat(document.getElementById('amount').value) || 0);
    if(!items.length && !(amt > 0)){ toast('先选项目或填业绩'); return; }

    var itemComm = 0, head = 0;
    items.forEach(function(x){ itemComm += x.comm; head += x.weight; });
    var revComm = round2(amt * (state.settings.cardRate || 0.1));
    var total = round2(itemComm + revComm);

    var rows = items.map(function(x){
      return '<div class="line"><span>'+x.name+'</span><span>提 '+fmt(x.comm)+' · 人头 '+headStr(x.weight)+'</span></div>';
    }).join('');
    if(amt > 0){
      rows += '<div class="line"><span>业绩 ¥'+fmt(amt)+'</span><span>提 '+fmt(revComm)+'</span></div>';
    }

    openSheet(
      '<div class="head">核对一下，点确认才记账</div>'+
      rows+
      '<div class="total"><span>合计 人头 <b>'+headStr(head)+'</b></span><span>提成 <b>¥'+fmt(total)+'</b></span></div>'+
      '<button id="okBtn" style="color:#2f6bff;font-weight:600">确认记一笔</button>'+
      '<button class="cancel">取消</button>'
    );

    document.getElementById('okBtn').onclick = function(){
      var rec = {
        id: 'r'+Date.now()+Math.floor(Math.random()*99),
        at: clock(),
        items: items,
        rev: amt,
        comm: total,
        head: round2(head)
      };
      if(!state.days[cur]) state.days[cur] = [];
      state.days[cur].push(rec);
      save();
      sel = {};
      document.getElementById('amount').value = '';
      closeSheet();
      render();
      lastUndo = { day:cur, id:rec.id };
      toast('已记 · 提成 ¥'+fmt(total), '撤销', function(){
        if(!lastUndo) return;
        state.days[lastUndo.day] = dayList(lastUndo.day).filter(function(x){ return x.id !== lastUndo.id; });
        save(); render(); lastUndo = null; toast('已撤销');
      });
      if(navigator.vibrate) navigator.vibrate(8);
    };
  }

  // ---------- 弹层 ----------
  function toast(msg, actionText, action){
    var el = document.getElementById('toast');
    el.innerHTML = '<span>'+msg+'</span>' + (actionText ? '<u>'+actionText+'</u>' : '');
    el.classList.add('on');
    clearTimeout(el._t);
    el.onclick = action ? function(){ el.classList.remove('on'); action(); } : null;
    el._t = setTimeout(function(){ el.classList.remove('on'); }, actionText ? 4000 : 1600);
  }
  function openSheet(html){
    document.getElementById('toast').classList.remove('on');
    document.getElementById('sheet').innerHTML = html;
    document.getElementById('sheet').classList.add('on');
    document.getElementById('mask').classList.add('on');
    var c = document.querySelector('#sheet .cancel');
    if(c) c.onclick = closeSheet;
  }
  function closeSheet(){
    document.getElementById('sheet').classList.remove('on');
    document.getElementById('mask').classList.remove('on');
  }

  // ---------- 事件 ----------
  document.getElementById('pjbar').addEventListener('click', function(e){
    var b = e.target.closest('.pj'); if(!b) return;
    var id = b.dataset.id;
    if(sel[id]) delete sel[id]; else sel[id] = true;
    renderBars();
  });

  document.getElementById('amount').addEventListener('input', renderSel);
  document.getElementById('send').addEventListener('click', confirmRecord);

  document.getElementById('list').addEventListener('click', function(e){
    var row = e.target.closest('.row'); if(!row) return;
    var id = row.dataset.id, list = dayList(cur), rec = null;
    for(var i=0;i<list.length;i++) if(list[i].id===id) rec = list[i];
    if(!rec) return;
    var extra = recordRev(rec) > 0 ? '<button class="edit">改业绩金额</button>' : '';
    openSheet(extra + '<button class="danger del">删除这条</button><button class="cancel">取消</button>');
    var del = document.querySelector('#sheet .del');
    if(del) del.onclick = function(){
      state.days[cur] = dayList(cur).filter(function(x){ return x.id !== id; });
      save(); render(); closeSheet(); toast('已删除');
    };
    var ed = document.querySelector('#sheet .edit');
    if(ed) ed.onclick = function(){
      var v = prompt('输入新的业绩金额', recordRev(rec));
      if(v === null) return;
      var na = round2(parseFloat(v) || 0);
      if(na < 0){ toast('金额不对'); return; }
      var itemComm = 0;
      (rec.items||[]).forEach(function(x){ itemComm += x.comm; });
      rec.rev = na;
      rec.comm = round2(itemComm + na * (state.settings.cardRate || 0.1));
      save(); render(); closeSheet();
    };
  });

  document.getElementById('mask').addEventListener('click', closeSheet);
  document.getElementById('prev').onclick = function(){ var d=parseDate(cur); d.setDate(d.getDate()-1); cur=ymd(d); render(); };
  document.getElementById('next').onclick = function(){ var d=parseDate(cur); d.setDate(d.getDate()+1); cur=ymd(d); render(); };
  document.querySelector('.datemid').onclick = function(){ cur=todayStr(); render(); toast('回到今天'); };

  // ---------- 周 / 月总结 ----------
  var rMode = 'week', rAnchor = todayStr();

  function rangeOf(mode, anchorStr){
    var d = parseDate(anchorStr), start, end;
    if(mode === 'week'){
      start = new Date(d); start.setDate(d.getDate() - ((d.getDay()+6)%7));
      end = new Date(start); end.setDate(start.getDate()+6);
    }else{
      start = new Date(d.getFullYear(), d.getMonth(), 1);
      end = new Date(d.getFullYear(), d.getMonth()+1, 0);
    }
    return { start:start, end:end };
  }

  function statsBetween(start, end){
    var rev=0, comm=0, head=0, by={}, days=[];
    for(var t=new Date(start); t<=end; t.setDate(t.getDate()+1)){
      var key = ymd(t), arr = dayList(key);
      if(!arr.length) continue;
      var dRev=0, dComm=0, dHead=0;
      for(var i=0;i<arr.length;i++){
        var r = arr[i];
        dRev += recordRev(r); dComm += recordComm(r); dHead += recordHead(r);
        (r.items||[]).forEach(function(x){
          if(!by[x.name]) by[x.name] = { n:0, w:0, comm:0 };
          by[x.name].n++; by[x.name].w += x.weight; by[x.name].comm += x.comm;
        });
      }
      rev += dRev; comm += dComm; head += dHead;
      days.push({ key:key, rev:dRev, comm:dComm, head:dHead });
    }
    return { rev:rev, comm:comm, head:head, by:by, days:days };
  }

  function renderReport(){
    var r = rangeOf(rMode, rAnchor);
    var s = statsBetween(r.start, r.end);
    var lbl = document.getElementById('rLabel');
    if(rMode === 'week'){
      lbl.textContent = (r.start.getMonth()+1)+'月'+r.start.getDate()+'日 – '+(r.end.getMonth()+1)+'月'+r.end.getDate()+'日';
    }else{
      lbl.textContent = r.start.getFullYear()+'年'+(r.start.getMonth()+1)+'月';
    }

    var active = s.days.length || 1;

    var prevStart, prevEnd;
    if(rMode === 'week'){
      prevStart = new Date(r.start); prevStart.setDate(r.start.getDate()-7);
      prevEnd = new Date(r.end); prevEnd.setDate(r.end.getDate()-7);
    }else{
      prevStart = new Date(r.start.getFullYear(), r.start.getMonth()-1, 1);
      prevEnd = new Date(r.start.getFullYear(), r.start.getMonth(), 0);
    }
    var p = statsBetween(prevStart, prevEnd);
    var cmp = '';
    if(p.rev > 0){
      var diff = (s.rev - p.rev) / p.rev * 100;
      var unit = rMode === 'week' ? '周' : '月';
      if(Math.abs(diff) < 0.5){
        cmp = '与上'+unit+'持平（¥'+fmt(p.rev)+' · '+headStr(p.head)+' 个）';
      }else{
        var sign = diff > 0 ? '+' : '';
        cmp = '较上'+unit+' <b>'+sign+diff.toFixed(0)+'%</b>（上'+unit+' ¥'+fmt(p.rev)+' · '+headStr(p.head)+' 个）';
      }
    }else{
      cmp = '上'+(rMode==='week'?'周':'月')+'暂无记录';
    }

    var rows = '';
    Object.keys(s.by).forEach(function(name){
      var v = s.by[name];
      rows += '<div class="trow"><div class="nm">'+name+'</div>'+
              '<div class="c">'+v.n+' 次</div>'+
              '<div class="c">'+headStr(v.w)+' 个</div>'+
              '<div class="m">提 '+fmt(v.comm)+'</div></div>';
    });
    if(!rows) rows = '<div class="trow" style="color:#9aa1ad">这个周期还没有记录</div>';

    var dayRows = '';
    for(var i=s.days.length-1;i>=0;i--){
      var d = s.days[i], dt = parseDate(d.key);
      var wk = ['日','一','二','三','四','五','六'][dt.getDay()];
      dayRows += '<div class="day" data-d="'+d.key+'">'+
        '<div class="d">'+(dt.getMonth()+1)+'/'+dt.getDate()+' 周'+wk+'</div>'+
        '<div class="n">'+headStr(d.head)+' 个</div>'+
        '<div class="v">'+(d.rev>0?('¥'+fmt(d.rev)):'—')+'<span>提 '+fmt(d.comm)+'</span></div></div>';
    }
    if(!dayRows) dayRows = '<div class="day" style="color:#9aa1ad">这一'+(rMode==='week'?'周':'月')+'还没记过</div>';

    document.getElementById('rBody').innerHTML =
      '<div class="kpis">'+
        '<div class="kpi hero"><div class="v">'+fmt(s.rev)+'<small>元</small></div><div class="k">业绩合计</div></div>'+
        '<div class="kpi"><div class="v">'+fmt(s.comm)+'<small>元</small></div><div class="k">提成合计</div></div>'+
        '<div class="kpi"><div class="v">'+headStr(s.head)+'<small>个</small></div><div class="k">人头合计</div></div>'+
        '<div class="kpi"><div class="v">'+fmt(Math.round(s.rev/active))+'<small>元</small></div><div class="k">日均业绩</div></div>'+
      '</div>'+
      '<div class="cmp">'+cmp+'</div>'+
      '<div class="cmp" style="padding-top:2px">有记录 '+s.days.length+' 天</div>'+
      '<div class="blk"><h3>项目分布</h3>'+rows+'</div>'+
      '<div class="blk"><h3>每日明细</h3>'+dayRows+'</div>';
  }

  document.getElementById('summary').onclick = function(){
    rAnchor = cur; rMode = 'week';
    document.querySelectorAll('#seg button').forEach(function(b){ b.classList.toggle('on', b.dataset.m === 'week'); });
    renderReport();
    document.getElementById('report').classList.add('on');
  };
  document.getElementById('rClose').onclick = function(){ document.getElementById('report').classList.remove('on'); };
  document.getElementById('seg').addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    rMode = b.dataset.m;
    document.querySelectorAll('#seg button').forEach(function(x){ x.classList.toggle('on', x === b); });
    renderReport();
  });
  document.getElementById('rPrev').onclick = function(){
    var d = parseDate(rAnchor);
    if(rMode === 'week') d.setDate(d.getDate()-7); else d.setMonth(d.getMonth()-1);
    rAnchor = ymd(d); renderReport();
  };
  document.getElementById('rNext').onclick = function(){
    var d = parseDate(rAnchor);
    if(rMode === 'week') d.setDate(d.getDate()+7); else d.setMonth(d.getMonth()+1);
    rAnchor = ymd(d); renderReport();
  };
  document.getElementById('rBody').addEventListener('click', function(e){
    var row = e.target.closest('.day'); if(!row || !row.dataset.d) return;
    cur = row.dataset.d;
    document.getElementById('report').classList.remove('on');
    render();
  });

  // ---------- 设置 ----------
  document.getElementById('settings').onclick = function(){
    var days = Object.keys(state.days).filter(function(k){ return state.days[k] && state.days[k].length; }).length;
    openSheet(
      '<div class="head">业绩提成比例（%）　·　已有 '+days+' 天记录</div>'+
      '<div style="display:flex;gap:8px;padding:0 10px 12px">'+
        '<input id="rateInput" type="number" inputmode="decimal" step="0.5" value="'+(Math.round(state.settings.cardRate*1000)/10)+'" style="flex:1;height:46px;border-radius:12px;border:none;background:#f1f3f7;padding:0 14px;font-size:16px;font-family:inherit;outline:none">'+
        '<button id="saveRate" style="border:none;background:#2f6bff;color:#fff;border-radius:12px;padding:0 18px;font-size:15px;font-family:inherit">保存</button>'+
      '</div>'+
      '<button id="manageProjects">项目与提成（'+state.projects.length+' 项）</button>'+
      '<button id="exp">导出备份文件</button>'+
      '<button id="imp">导入备份文件</button>'+
      '<button class="danger" id="clearDay">清空这天的记录</button>'+
      '<button class="cancel">关闭</button>'
    );

    document.getElementById('saveRate').onclick = function(){
      var v = parseFloat(document.getElementById('rateInput').value);
      if(!(v > 0 && v <= 100)){ toast('比例要填 1–100'); return; }
      state.settings.cardRate = v/100; save(); closeSheet(); toast('比例已改为 '+v+'%');
    };

    document.getElementById('manageProjects').onclick = function(){ closeSheet(); setTimeout(openProjects, 260); };

    document.getElementById('exp').onclick = function(){
      try{
        var blob = new Blob([JSON.stringify(state, null, 2)], { type:'application/json' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = '头疗日记-备份-'+todayStr()+'.json';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);
        toast('备份文件已生成');
      }catch(e){ toast('导出失败：'+e.message); }
    };

    document.getElementById('imp').onclick = function(){
      var inp = document.createElement('input');
      inp.type = 'file'; inp.accept = '.json,application/json';
      inp.onchange = function(){
        var f = inp.files && inp.files[0]; if(!f) return;
        var fr = new FileReader();
        fr.onload = function(){
          try{
            var o = JSON.parse(fr.result);
            if(!o || !o.days) throw new Error('不是本应用的备份');
            if(!confirm('导入会合并记录，同一天以备份为准。继续？')) return;
            Object.keys(o.days).forEach(function(k){ state.days[k] = o.days[k]; });
            if(o.settings && o.settings.cardRate) state.settings.cardRate = o.settings.cardRate;
            if(o.projects && o.projects.length) state.projects = o.projects;
            save(); render(); closeSheet(); toast('导入完成');
          }catch(e){ toast('导入失败：'+e.message); }
        };
        fr.readAsText(f);
      };
      inp.click();
    };

    document.getElementById('clearDay').onclick = function(){
      if(!confirm('清空 '+cur+' 的全部记录？删了拿不回来。')) return;
      state.days[cur] = []; save(); render(); closeSheet(); toast('已清空这天');
    };
  };

  // ---------- 项目管理 ----------
  function openProjects(){
    var rows = state.projects.map(function(p, i){
      return '<div class="prow" data-i="'+i+'">'+
        '<input class="nm" value="'+p.name.replace(/"/g,'&quot;')+'" placeholder="项目名">'+
        '<input class="num c" type="number" inputmode="decimal" value="'+p.comm+'" placeholder="提成">'+
        '<input class="num w" type="number" inputmode="decimal" step="0.5" value="'+p.weight+'" placeholder="人头">'+
        '<button class="del">✕</button>'+
      '</div>';
    }).join('');

    openSheet(
      '<div class="head">项目名 · 提成(元) · 人头权重</div>'+
      '<div id="plist">'+rows+'</div>'+
      '<button class="addpj" id="addPj">＋ 添加项目</button>'+
      '<button id="savePj" style="color:#2f6bff;font-weight:600">保存</button>'+
      '<button class="cancel">取消</button>'
    );

    document.getElementById('addPj').onclick = function(){
      var i = state.projects.length;
      state.projects.push({ id:'p'+Date.now(), name:'新项目', comm:10, weight:1 });
      closeSheet(); setTimeout(openProjects, 260);
    };

    document.getElementById('plist').addEventListener('click', function(e){
      var del = e.target.closest('.del'); if(!del) return;
      var row = del.closest('.prow');
      var i = +row.dataset.i;
      if(state.projects.length <= 1){ toast('至少留一个项目'); return; }
      state.projects.splice(i, 1);
      closeSheet(); setTimeout(openProjects, 260);
    });

    document.getElementById('savePj').onclick = function(){
      var rowsEl = document.querySelectorAll('#plist .prow');
      var next = [];
      for(var i=0;i<rowsEl.length;i++){
        var el = rowsEl[i];
        var name = el.querySelector('.nm').value.trim();
        var comm = parseFloat(el.querySelector('.c').value);
        var w = parseFloat(el.querySelector('.w').value);
        if(!name) continue;
        if(isNaN(comm) || comm < 0) comm = 0;
        if(isNaN(w) || w < 0) w = 0;
        next.push({ id: state.projects[i] ? state.projects[i].id : 'p'+Date.now()+i, name: name, comm: comm, weight: w });
      }
      if(!next.length){ toast('至少要有一个项目'); return; }
      state.projects = next;
      save(); closeSheet(); render(); toast('项目已更新');
    };
  }

  render();
})();
</script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){ /* 离线能力可选，失败不影响使用 */ });
  });
}
</script>
</body>
